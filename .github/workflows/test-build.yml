# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: mscape_test_build_workflow

on:
  pull_request:
    branches: [ "main" , "dev" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v3
      with:
        python-version: "3.14"
    - name: Install codebase
      run: pip install .
    - name: Install tests and linter
      run: pip install ruff pytest pytest-cov
    - name: Lint with ruff
      run: |
        # Stop the build if there are Python syntax errors
        ruff check --output-format=github --target-version=py314
    - name: Test with pytest
      run: |
        pytest --junitxml=junit/test-results.xml --cov=com --cov-report=xml --cov-report=html
